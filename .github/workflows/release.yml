name: Release

# Conventional commits on main drive the whole release. release-please keeps a
# single open "release PR" carrying the computed version + changelog; merging it
# tags, creates the GitHub release, and publishes to npm.
#
# Feature PRs must NOT bump the version — see docs/releases.md. The bump lives
# only in the release PR, which is why two branches landing the same day can no
# longer claim the same version.

on:
  push:
    branches: [main]

  # Retry a publish that failed or was skipped, without cutting a new version.
  # release-please is idempotent but not repeatable: re-running the whole
  # workflow after a release is already cut finds nothing to release, so the
  # publish job is skipped and the tag is left with no tarball. This is the way
  # back — Actions → Release → Run workflow → the tag you need published.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v1.25.0'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # The org's release bot, so the release PR and the tag are attributed to
      # an app rather than to github-actions[bot] (which cannot satisfy the
      # "unattributed changes" rule on main).
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

  publish:
    needs: release-please
    # `!cancelled()` so the manual path still runs when release-please is
    # skipped. A release-please *failure* leaves release_created empty, so the
    # push path stays gated on a real release.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      # Build from the tag, not from main: main may already have moved on.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Configure npm
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > .npmrc

      # Catches an expired or rotated token before we spend a build on it. It
      # does NOT prove the token can publish — a read-only token passes this and
      # then 403s on PUT, which is exactly what happened on the first real
      # release. The publish step below explains that case.
      - name: Check the npm token is live
        run: |
          if ! npm whoami; then
            echo "::error::NPM_TOKEN cannot authenticate to npm at all — it is expired or rotated." \
                 "Mint a granular token with read+write access to @dabble/patches, update the NPM_TOKEN repo secret," \
                 "then re-run: Actions → Release → Run workflow → tag = $TAG."
            exit 1
          fi

      # `prepare` runs the build on install, and again on publish, so the
      # tarball is always built from this tag's source.
      - run: npm ci

      - name: Publish to npm
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")

          # Makes the manual retry safe to run twice, and tells "already done"
          # apart from "not allowed" — npm answers 403 to both.
          if [ -n "$(npm view "$name@$version" version 2>/dev/null || true)" ]; then
            echo "::notice::$name@$version is already published — nothing to do."
            exit 0
          fi

          # npm points `latest` at whatever was published most recently, not at
          # the highest version. Backfilling a tag that predates what npm already
          # serves would therefore drag `latest` backwards, so park it elsewhere.
          args=""
          latest=$(npm view "$name" version 2>/dev/null || true)
          if [ -n "$latest" ] && [ "$(node -e 'const [a,b]=process.argv.slice(1).map(v=>v.split(".").map(Number)); console.log((a[0]-b[0]||a[1]-b[1]||a[2]-b[2])<0?"older":"newer")' "$version" "$latest")" = "older" ]; then
            echo "::notice::$version predates the published latest ($latest) — publishing under the 'backfill' dist-tag so 'latest' stays put."
            args="--tag backfill"
          fi

          set +e
          npm publish $args 2>&1 | tee /tmp/publish.log
          code=${PIPESTATUS[0]}
          set -e

          if [ $code -ne 0 ]; then
            retry="Then re-run: Actions → Release → Run workflow → tag = $TAG. The tag and GitHub release already exist, so nothing is lost."
            if grep -q "EOTP" /tmp/publish.log; then
              echo "::error::NPM_TOKEN needs a one-time password, so it is a classic *Publish* token — those still prompt for 2FA and cannot work unattended. Replace it with a classic **Automation** token or a **Granular Access Token**; both bypass 2FA. $retry"
            elif grep -qE "E403|403 Forbidden" /tmp/publish.log; then
              echo "::error::NPM_TOKEN authenticated (see whoami above) but has no write access to $name — a read-only token. Mint one with read+write on $name and update the repo secret. $retry"
            else
              echo "::error::Failed to publish $name@$version — see the npm output above. $retry"
            fi
            exit $code
          fi
