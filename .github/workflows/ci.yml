name: CI Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # Versions are cut only by the release PR (docs/releases.md). A bump in a
      # feature PR is how two branches used to end up claiming the same version.
      - name: Guard against a manual version bump
        if: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--') }}
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          git show FETCH_HEAD:package.json > /tmp/base-package.json
          base=$(node -p "require('/tmp/base-package.json').version")
          head=$(node -p "require('$PWD/package.json').version")
          if [ "$base" != "$head" ]; then
            echo "::error file=package.json::Version changed $base → $head. Feature PRs must not bump the version — release-please cuts it in the release PR when this merges. Revert package.json and package-lock.json to $base. See docs/releases.md."
            exit 1
          fi
          echo "Version unchanged ($head)"

      - name: Configure npm for private packages
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > .npmrc

      - name: Install dependencies
        run: npm ci

      - name: Run Type Check
        run: npm run type:check

      - name: Run Lint Check
        run: npm run lint

      - name: Run Format Check
        run: npm run format:check

      - name: Run Tests
        run: npm run test
